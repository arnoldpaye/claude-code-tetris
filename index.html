<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Game over -->
        <div id="gameover-view" class="menu-view">
          <button id="restart-btn" class="menu-btn primary">Reiniciar</button>
        </div>

        <!-- Menú de pausa principal -->
        <div id="pause-view" class="menu-view hidden" role="menu">
          <button id="resume-btn" class="menu-btn primary" role="menuitem">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn" role="menuitem">Reiniciar</button>
          <button id="controls-btn" class="menu-btn" role="menuitem">Ver controles</button>
          <div class="level-picker" role="group" aria-labelledby="level-picker-label">
            <span id="level-picker-label" class="label">NIVEL INICIAL</span>
            <div class="stepper">
              <button id="level-down" class="step-btn" aria-label="Bajar nivel inicial">&minus;</button>
              <span id="start-level-value" class="stepper-value" aria-live="polite">1</span>
              <button id="level-up" class="step-btn" aria-label="Subir nivel inicial">+</button>
            </div>
            <span class="hint">Se aplica al reiniciar</span>
          </div>
        </div>

        <!-- Controles -->
        <div id="controls-view" class="menu-view hidden">
          <ul class="controls-list">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa / menú</li>
          </ul>
          <button id="controls-back-btn" class="menu-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
