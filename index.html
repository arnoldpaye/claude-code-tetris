<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title" class="title-start">TETRIS</p>
        <p id="overlay-score"></p>

        <div id="new-record" class="new-record hidden">
          <p class="new-record-msg">&#9733; ¡NUEVO RÉCORD! Puesto #<span id="new-record-rank"></span> &#9733;</p>
          <div class="name-form">
            <input id="player-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" />
            <button id="save-record-btn">Guardar</button>
          </div>
        </div>

        <div id="records" class="records">
          <span class="label">MEJORES PUNTUACIONES</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>NOMBRE</th><th>PUNTOS</th><th>LÍN.</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <div class="records-stats">
            <div class="stat">
              <span class="label">MEJOR COMBO</span>
              <span id="best-combo" class="stat-value">0</span>
            </div>
            <div class="stat">
              <span class="label">LÍNEAS MÁX.</span>
              <span id="max-lines" class="stat-value">0</span>
            </div>
          </div>
          <button id="reset-records-btn" class="link-btn">Resetear records</button>
        </div>

        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
